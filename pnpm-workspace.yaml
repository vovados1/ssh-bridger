allowBuilds:
  # ssh2 and cpu-features only build optional native accelerators. They would need an
  # Electron-ABI rebuild to load, so we run on ssh2's pure-JS fallback instead.
  cpu-features: false
  electron: true
  # Windows-only installer support pulled in by electron-builder; this app ships for Linux only.
  electron-winstaller: false
  esbuild: true
  ssh2: false
